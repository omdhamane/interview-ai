services:
  - type: web
    name: interview-ai-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
